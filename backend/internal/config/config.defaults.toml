# 默认配置（会被后端加载）。如需自定义配置：复制本文件为 `config.toml` 并修改。

[app]
name = "chatgpt2api-studio"
version = "1.2.10"
api_key = ""
auth_key = "chatgpt2api"
image_format = "url"
max_upload_size_mb = 50

[server]
host = "0.0.0.0"
port = 7000
static_dir = "static"
max_image_concurrency = 8
image_queue_limit = 32
image_queue_timeout_seconds = 20
image_task_queue_ttl_seconds = 600

[chatgpt]
model = "gpt-image-2"
sse_timeout = 600
poll_interval = 3
poll_max_wait = 600
request_timeout = 120
image_mode = "studio"

# 图片请求统一走 external_responses；旧的 legacy / conversation 配置会自动兼容为 responses。
# Free 账号链路实际使用 external_responses，并强制 low 质量。
free_image_route = "responses"

# Free 账号 external_responses 上游模型名。
# 默认 auto，表示保留兼容模型选择。
free_image_model = "auto"

# Plus / Pro / Team 账号图片请求统一走 external_responses。
paid_image_route = "responses"

# Plus / Pro / Team 账号真正发给上游的模型名。
# 默认 gpt-5.4-mini，也可以改成 gpt-5.4。
paid_image_model = "gpt-5.4-mini"

# Studio 模式下，是否允许“已禁用但仍有图片额度”的账号继续参与图片生成。
# 仅对 Studio 模式生效；CPA 不受影响。
studio_allow_disabled_image_accounts = false

# 官方图片接口出错后，自动换下一个可用账号重试的次数。
# 0 表示不额外重试；最大 10。
image_account_retry_times = 3

[accounts]
default_quota = 5
prefer_remote_refresh = true
refresh_workers = 6
image_quota_refresh_ttl_seconds = 120
daily_free_image_limit = 120
daily_paid_image_limit = 30

[storage]
backend = "current"
config_backend = "file"
auth_dir = "data/auths"
state_file = "data/accounts_state.json"
sync_state_dir = "data/sync_state"
image_dir = "data/tmp/image"
image_storage = "server"
image_conversation_storage = "server"
image_data_storage = "server"
sqlite_path = "data/chatgpt-image-studio.db"
redis_addr = "127.0.0.1:6379"
redis_password = ""
redis_db = 0
redis_prefix = "chatgpt2api:studio"

# CLIProxyAPI / CPA 同步配置。
# 如果你暂时不需要远端号池同步，请保持 enabled=false。
[sync]
enabled = false
base_url = ""
management_key = ""
request_timeout = 20
concurrency = 4
provider_type = "codex"

# 固定代理配置。用于访问 ChatGPT 官方接口。
# 当前仅支持 fixed 模式，url 支持 socks5 / socks5h / http / https。
# 如果 sync_enabled = true，CPA 同步请求也会复用同一代理。
[proxy]
enabled = false
url = "socks5h://127.0.0.1:10808"
mode = "fixed"
sync_enabled = false

# CPA 图片接口配置。
# 当 image_mode = "cpa" 时会使用这里的 base_url / api_key。
# 如果 cpa.base_url 为空，会回退复用 sync.base_url。
[cpa]
base_url = ""
api_key = ""
request_timeout = 60
route_strategy = "images_api"

# 外部 Responses 图片接口配置。
# 启用后，Studio 的 responses 链路会优先请求 base_url + /v1/responses；失败后回退官方账号 responses。
[external_responses]
enabled = false
base_url = ""
api_key = ""
model = "gpt-5"
request_timeout = 300
# external_responses 遇到 5xx 时的无感重试次数，默认 3，最大 10。
retry_times = 3

# 提交给 external_responses 的参考图引用方式：url 或 base64。
# url 会把图片临时保存到本服务，再用 reference_image_base_url + /v1/files/image/... 传给上游。
# base64 会直接传 data:image/jpeg;base64,...，不依赖公网图片地址。
reference_image_mode = "url"

# url 引用方式的公开访问根地址；为空时使用内置默认图片域名。
# 如需走代理，可填写类似 https://proxy.example/http://origin.example。
reference_image_base_url = ""

[newapi]
base_url = ""
username = ""
password = ""
access_token = ""
user_id = 0
session_cookie = ""
request_timeout = 20

[sub2api]
base_url = ""
email = ""
password = ""
api_key = ""
group_id = ""
request_timeout = 20

[log]
log_all_requests = false
